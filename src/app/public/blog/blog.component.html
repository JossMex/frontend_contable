<app-navbar></app-navbar>

<section class="page-banner">
  <div class="container">
    <h1>Blog y Recursos</h1>
    <p>Artículos, guías y consejos sobre contabilidad y fiscalidad</p>
  </div>
</section>

<section class="seccion">
  <div class="container">

    <div *ngIf="cargando" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>

    <div *ngIf="!cargando && articulos.length === 0" class="sin-articulos">
      <p>📭 Próximamente publicaremos artículos de interés.</p>
    </div>

    <div *ngIf="!cargando && articulos.length > 0" class="blog-grid">
      <div *ngFor="let articulo of articulos" class="blog-card" (click)="verArticulo(articulo.id!)">
        <div class="blog-card-imagen">
          <img  title="imagen" *ngIf="articulo.imagenUrl" [src]="articulo.imagenUrl" [alt]="articulo.titulo"
            onerror="this.style.display='none'">
          <div *ngIf="!articulo.imagenUrl" class="blog-card-placeholder">
            📝
          </div>
        </div>
        <div class="blog-card-body">
          <div class="blog-card-meta">
            <span>{{ articulo.autor?.nombre }}</span>
            <span>{{ articulo.fechaPublicacion | date:'dd/MM/yyyy' }}</span>
          </div>
          <h3>{{ articulo.titulo }}</h3>
          <p>{{ articulo.resumen }}</p>
          <span class="blog-leer-mas">Leer más →</span>
        </div>
      </div>
    </div>

  </div>
</section>

<app-footer></app-footer>
